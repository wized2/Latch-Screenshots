name: Capture Latch screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Latch debug APK
        run: |
          set -eux
          mkdir -p apk
          git clone --depth 1 https://github.com/wized2/Latch.git /tmp/Latch
          cd /tmp/Latch
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*-debug.apk "$GITHUB_WORKSPACE/apk/latch.apk"
          ls -la "$GITHUB_WORKSPACE/apk/"

      - name: Emulator + screenshots (Pixel 9 class)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1080x2424
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/capture.sh

      - name: Commit screenshots
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # drop old wrong 04 name if present
          git rm -f screenshots/04_edit_or_create.png 2>/dev/null || true
          git add screenshots/*.png
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: Pixel 9-class screenshots (API 34)"
            git push
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latch-screenshots
          path: screenshots/
