name: Capture Latch screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Latch debug APK
        run: |
          set -eux
          mkdir -p apk
          git clone --depth 1 https://github.com/wized2/Latch.git /tmp/Latch
          cd /tmp/Latch
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*-debug.apk "$GITHUB_WORKSPACE/apk/latch.apk"
          ls -la "$GITHUB_WORKSPACE/apk/"
          file "$GITHUB_WORKSPACE/apk/latch.apk"

      - name: Emulator + screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eux
            adb wait-for-device
            for i in $(seq 1 90); do
              booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$booted" = "1" ]; then echo "booted"; break; fi
              sleep 3
            done
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r -t apk/latch.apk
            PKG=com.endroid.latch
            adb shell am force-stop "$PKG" || true
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 8
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/01_home.png
            adb shell input tap 1000 150
            sleep 3
            adb exec-out screencap -p > screenshots/02_settings.png
            adb shell input swipe 540 1700 540 400 350
            sleep 1
            adb exec-out screencap -p > screenshots/03_settings_scrolled.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell input tap 980 1900
            sleep 3
            adb exec-out screencap -p > screenshots/04_edit_or_create.png
            ls -la screenshots
            file screenshots/*.png
            for f in screenshots/*.png; do
              sz=$(stat -c%s "$f")
              test "$sz" -gt 1000
            done

      - name: Commit screenshots
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update screenshots"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: latch-screenshots
          path: screenshots/
